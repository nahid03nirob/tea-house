<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

            <button class="py-2 px-4  text-white rounded-md bg-center cursor-pointer h-14 bg-linear-to-r from-[#FF8938] to-[#FF0000]">Explore More <img class="inline size-3" src="images/arrow.png" alt=""></button>
